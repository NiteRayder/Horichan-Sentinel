# Base44 development compose for Horichan Sentinel.
# Single-origin wiring: Vite dev server (5173) is the web entry point mapped to
# host port 3000; it proxies /api, /auth, /logout to the Express server on 3000
# inside the same container. Both processes run via concurrently with live reload.
services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy Host header is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && export PATH=\"$PWD/node_modules/.bin:$PATH\" && exec ./node_modules/.bin/concurrently -k -n server,client 'node --watch src/server/index.js' 'vite --host 0.0.0.0 --port 5173'",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:3000/health >/dev/null && curl -sf http://localhost:5173/ >/dev/null || exit 1",
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: on-failure
